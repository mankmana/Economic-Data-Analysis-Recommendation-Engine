<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Simple economic data application architecture</title>
  <desc id="desc">A simple flow from the user to the web interface, backend agent, grounded GDP and Core CPI data, and the final answer with a chart.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667788"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#263238" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="520" fill="#f5f7f8"/>
  <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#14202b">How the application works</text>
  <text x="70" y="100" font-family="Inter, Arial, sans-serif" font-size="17" fill="#607080">A simple conversation flow over grounded FRED data</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="190" width="190" height="110" rx="16" fill="#e8f0ff" stroke="#3972c6" stroke-width="2"/>
    <text x="165" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">User</text>
    <text x="165" y="266" text-anchor="middle" font-size="16" fill="#24496d">Asks a question</text>

    <rect x="335" y="190" width="220" height="110" rx="16" fill="#e8f0ff" stroke="#3972c6" stroke-width="2"/>
    <text x="445" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#102a43">Web UI</text>
    <text x="445" y="266" text-anchor="middle" font-size="16" fill="#24496d">Query and answer pages</text>

    <rect x="630" y="170" width="240" height="150" rx="16" fill="#e8f7ee" stroke="#2f855a" stroke-width="2"/>
    <text x="750" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#173b2b">Backend agent</text>
    <text x="750" y="247" text-anchor="middle" font-size="16" fill="#2e6548">Understands the question</text>
    <text x="750" y="272" text-anchor="middle" font-size="16" fill="#2e6548">Calculates indicators</text>
    <text x="750" y="297" text-anchor="middle" font-size="16" fill="#2e6548">Creates the chart</text>

    <rect x="945" y="190" width="220" height="110" rx="16" fill="#fff3e4" stroke="#c77921" stroke-width="2"/>
    <text x="1055" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#4a2b0a">Grounded data</text>
    <text x="1055" y="260" text-anchor="middle" font-size="16" fill="#754b1c">GDP + Core CPI</text>
    <text x="1055" y="284" text-anchor="middle" font-size="16" fill="#754b1c">Saved FRED observations</text>

    <rect x="1240" y="190" width="110" height="110" rx="16" fill="#f2eaff" stroke="#7c4dba" stroke-width="2"/>
    <text x="1295" y="230" text-anchor="middle" font-size="21" font-weight="700" fill="#321650">Answer</text>
    <text x="1295" y="259" text-anchor="middle" font-size="16" fill="#5e3982">Text</text>
    <text x="1295" y="282" text-anchor="middle" font-size="16" fill="#5e3982">Chart</text>
  </g>

  <g stroke="#667788" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 245 H335"/>
    <path d="M555 245 H630"/>
    <path d="M870 245 H945"/>
    <path d="M1165 245 H1240"/>
    <path d="M1055 300 C1055 380 750 410 750 320"/>
  </g>

  <text x="70" y="430" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#607080">Data source</text>
  <text x="70" y="458" font-family="Inter, Arial, sans-serif" font-size="16" fill="#607080">Saved FRED HTML files are converted into grounded GDP and Core CPI observations.</text>
  <text x="70" y="487" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8794a0">The response is based only on the connected grounded data.</text>
</svg>
